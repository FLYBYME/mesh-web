site:
  id: console
  title: SurfDNS Console
  theme: dark

layout:
  regions:
    header:  { slots: [nav, spacer, search, notifications, user] }
    sidebar: { slots: [primary, secondary], collapsible: true }
    content: { roles: [page] }
    footer:  { slots: [status] }
  banners: enabled
  taskSwitcher:
    enabled: true
    hotkey: "Ctrl+`"

apps:
  - id: domains
    module: ./apps/domains.js
    load: on-route
    auth: user
    surfaces:
      - { role: page, route: "/domains/*" }
      - { role: panel, slot: sidebar.primary, order: 10 }
